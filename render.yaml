services:
  - type: web
    name: new-test
    runtime: docker
    repo: https://github.com/wroxtaaar/Torrent-Studio
    branch: main
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      # Serve every stored (bundled or runtime) entry as-is; call providers only for missing ones.
      - key: CACHE_FIRST
        value: "true"
      # The container fetches the newest data bundle from the rolling "cache-data" release at start
      # (see backend/cache-seed/README.md). Set CACHE_BUNDLE_BASE_URL=off to disable.
      # Hollywood/Bollywood pages 1-3 (18 titles each) come from the cache; later pages call the
      # live API, so provider calls must stay allowed and the keys below must be set.
      # "true" would block every provider call (pages 4+ would then fail).
      - key: CACHE_ONLY_MODE
        value: "false"
      - key: TMDB_READ_ACCESS_TOKEN
        sync: false
      - key: TMDB_API_KEY
        sync: false
      - key: WATCHMODE_API_KEY
        sync: false
      - key: OMDB_API_KEY
        sync: false
      - key: SEEDR_API_TOKEN
        sync: false
      - key: SEEDR_SESSION_SECRET
        sync: false
      - key: ALLOW_LEGACY_SEEDR_TOKEN
        sync: false
      - key: GITHUB_FEEDBACK_TOKEN
        sync: false
      - key: GITHUB_FEEDBACK_REPO
        value: wroxtaaar/new-test
