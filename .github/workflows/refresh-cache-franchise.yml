name: Refresh Marvel, DC and classics cache

on:
  workflow_dispatch:   # manual only: run it from the Actions tab when you want an update

# One refresh at a time, and never alongside the other one (both commit to main).
concurrency:
  group: cache-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Refresh franchise data
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          WATCHMODE_API_KEY: ${{ secrets.WATCHMODE_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: python scripts/refresh_seed.py franchise
      # The refreshed seed must still serve every cached endpoint without provider calls.
      - name: Verify the cache-first guarantee
        working-directory: backend
        run: python -m pytest -q tests/test_cache_first.py
      - name: Commit refreshed seed
        run: |
          if git diff --quiet -- backend/cache-seed; then
            echo "Nothing changed; no commit."
            exit 0
          fi
          git config user.name "cache-refresh[bot]"
          git config user.email "cache-refresh@users.noreply.github.com"
          git add backend/cache-seed
          git commit -m "chore(cache): refresh Marvel/DC/classics $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
