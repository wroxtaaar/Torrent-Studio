name: Refresh Hollywood and Bollywood cache

on:
  schedule:
    - cron: "30 21 * * 0"   # Sundays 21:30 UTC = Monday 03:00 IST
  workflow_dispatch:
    inputs:
      torrent_scan:
        description: "Also re-scan torrent matches (slow; torrent sites may be blocked on GitHub runners)"
        type: boolean
        default: false

# One refresh at a time, and never alongside the other one (both commit to main).
concurrency:
  group: cache-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Refresh hollywood-bollywood data
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          WATCHMODE_API_KEY: ${{ secrets.WATCHMODE_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          REGIONAL_CACHE_TORRENT_SCAN: ${{ github.event.inputs.torrent_scan || 'false' }}
        run: python scripts/refresh_seed.py hollywood-bollywood
      # The refreshed seed must still serve every cached endpoint without provider calls.
      - name: Verify the cache-first guarantee
        working-directory: backend
        run: python -m pytest -q tests/test_cache_first.py
      - name: Commit refreshed seed
        run: |
          if git diff --quiet -- backend/cache-seed; then
            echo "Nothing changed; no commit."
            exit 0
          fi
          git config user.name "cache-refresh[bot]"
          git config user.email "cache-refresh@users.noreply.github.com"
          git add backend/cache-seed
          git commit -m "chore(cache): weekly Hollywood/Bollywood refresh $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
