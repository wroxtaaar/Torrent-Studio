services:
  torrent-studio:
    build:
      context: .
      dockerfile: Dockerfile
    image: torrent-studio:local
    container_name: torrent-studio
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      X1337_PROXY: "${X1337_PROXY:-}"
      CACHE_ONLY_MODE: "false"
      BACKFILL_MISSING_METADATA: "true"
      TMDB_READ_ACCESS_TOKENS: "${TMDB_READ_ACCESS_TOKENS:-}"
      OMDB_API_KEYS: "${OMDB_API_KEYS:-}"
      OMDB_API_KEY: "${OMDB_API_KEY:-}"
      MDBLIST_API_KEYS: "${MDBLIST_API_KEYS:-}"
      MDBLIST_API_KEY: "${MDBLIST_API_KEY:-}"
      SEEDR_SESSION_SECRET: "${SEEDR_SESSION_SECRET:?Set SEEDR_SESSION_SECRET in .env}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000}"
      # Movie torrent size window for the Prepare card (empty = search_limits.json defaults; Webtor takes the larger ones)
      TORRENT_MIN_SIZE_MB: "${TORRENT_MIN_SIZE_MB:-}"
      TORRENT_MAX_SIZE_GB: "${TORRENT_MAX_SIZE_GB:-}"
      # Nuvio Streams add-on running on this VPS (docs/nuvio-streams.md); set NUVIO_URL= empty to hide Download HD
      NUVIO_URL: "${NUVIO_URL-http://host.docker.internal:7777}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - torrent_studio_data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/api/health', timeout=5)"
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 60s

volumes:
  torrent_studio_data:
